name: Game 1 - Jam Out Parking Puzzle

on:
  push:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  play-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and Play
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAME_CODE: "PB7VMwYsys"
        run: |
          python -m pip install -q browser-use playwright
          python -m playwright install chromium --with-deps
          cat << 'EOF' > bot.py
          import os, asyncio, glob, shutil
          from browser_use import Agent, Browser, ChatGoogle

          async def run():
              slash = chr(47)
              game_link = "https:" + slash + slash + "www.astrocade.com" + slash + "s" + slash + os.environ["GAME_CODE"]
              task = (
                  f"Step 1: Call goto_url('{game_link}') and wait 7 seconds. "
                  "Step 2: Click the center of the screen at (720, 490), wait 4 seconds, then click the green Play button around (720, 560) or (720, 700). "
                  "Step 3: The game grid is located between x=530 to x=910 and y=260 to y=640. "
                  "Do NOT import PIL, numpy, or write image-processing code. Only use click_at_xy(x, y) to click unblocked cars inside that grid (where the path in front of the car's white arrow is open) for 12 moves."
              )
              for m in ['gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-2.5-flash-lite']:
                  agent = Agent(task=task, llm=ChatGoogle(model=m), browser=Browser('chromium', headless=True))
                  res = await agent.run(max_steps=20)
                  imgs = sorted(glob.glob(f'{agent.workspace}/**/*.jpg', recursive=True) + glob.glob(f'{agent.workspace}/**/*.png', recursive=True))
                  if imgs:
                      shutil.copy(imgs[-1], 'proof.jpg')
                  if not (res.error and ('503' in str(res.error) or '429' in str(res.error) or '404' in str(res.error))):
                      break
                  await asyncio.sleep(10)

          asyncio.run(run())
          EOF
          python bot.py
      - name: Save Proof and Keep Active
        if: always()
        run: |
          date > last_run.txt
          git config user.name "Astrocade Bot"
          git config user.email "bot@://github.com"
          git add last_run.txt
          [ -f proof.jpg ] && git add proof.jpg
          git commit -m "Keep alive and save proof" || exit 0
          git push
