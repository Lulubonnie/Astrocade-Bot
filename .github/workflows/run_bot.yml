name: Game 1 - Jam Out Parking Puzzle

on:
  push:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  play-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and Play
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install -q browser-use playwright
          python -m playwright install chromium --with-deps
          python -c "import asyncio, glob, shutil; from browser_use import Agent, Browser, ChatGoogle; 
          async def run():
              for m in ['gemini-flash-latest', 'gemini-2.5-flash-lite', 'gemini-flash-latest']:
                  agent = Agent(task='Go to https://astrocade.com, wait 6 seconds for the game to load, close any popups or banners, click Play, and make at least 8 moves inside Jam Out: Parking Puzzle.', llm=ChatGoogle(model=m), browser=Browser('chromium', headless=True))
                  res = await agent.run(max_steps=25)
                  imgs = sorted(glob.glob(f'{agent.workspace}/**/*.png', recursive=True))
                  if imgs: shutil.copy(imgs[-1], 'proof.png')
                  if not (res.error and '503' in str(res.error)): break
                  await asyncio.sleep(15)
          asyncio.run(run())"
      - name: Save Proof and Keep Active
        if: always()
        run: |
          date > last_run.txt
          git config user.name "Astrocade Bot"
          git config user.email "bot@://github.com"
          git add last_run.txt
          [ -f proof.png ] && git add proof.png
          git commit -m "Keep alive and save proof" || exit 0
          git push
