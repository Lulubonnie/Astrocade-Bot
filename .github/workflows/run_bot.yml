name: Auto Play Astrocade

on:
  push:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  play-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and Play
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install -q browser-use
          python -m playwright install chromium --with-deps
          python - << 'EOF'
          import asyncio
          from browser_use import Agent, Browser, ChatGoogle

          async def main():
              agent = Agent(
                  task="Go to https://astrocade.com, wait 5 seconds for the game to load, click Play, and play Jam Out: Parking Puzzle by moving or clicking the parked cars in order to clear the traffic jam.",
                  llm=ChatGoogle(model="gemini-3.8-flash-lite"),
                  browser=Browser("chromium", headless=True),
              )
              for attempt in range(5):
                  result = await agent.run(max_steps=30)
                  if result.error and "503" in str(result.error):
                      print("Server busy, retrying in 15s...")
                      await asyncio.sleep(15)
                  else:
                      break

          asyncio.run(main())
          EOF
