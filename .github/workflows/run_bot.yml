name: Game 1 - Jam Out Parking Puzzle

on:
  push:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  play-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and Play
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAME_CODE: "PB7VMwYsys"
        run: |
          python -m pip install -q browser-use playwright
          python -m playwright install chromium --with-deps
          cat << 'EOF' > bot.py
          import os, asyncio, glob, shutil
          from browser_use import Agent, Browser, ChatGoogle

          async def run():
              code = os.environ["GAME_CODE"]
              game_link = "https://astrocade.com" + code
              task = (
                  f"Step 1: Call goto_url('{game_link}') and wait 7 seconds for the JAM OUT loading bar to finish. "
                  "Step 2: Look at the screenshot. Click the big green Play button (with a white triangle) below the car grid and wait 2 seconds. "
                  "Step 3: Play Jam Out: Parking Puzzle using ONLY click_at_xy(x, y). Do NOT use js(), http_get(), or cdp(). "
                  "Each car has a white arrow showing which way it drives when clicked. Click unblocked cars whose path in front of the arrow is clear. "
                  "If a CLEARED! popup appears, click the green Play/Next button in the center. Play for at least 12 moves."
              )
              for m in ['gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-2.5-flash-lite']:
                  agent = Agent(task=task, llm=ChatGoogle(model=m), browser=Browser('chromium', headless=True))
                  res = await agent.run(max_steps=20)
                  imgs = sorted(glob.glob(f'{agent.workspace}/**/*.png', recursive=True))
                  if imgs:
                      shutil.copy(imgs[-1], 'proof.png')
                  if not (res.error and ('503' in str(res.error) or '429' in str(res.error) or '404' in str(res.error))):
                      break
                  await asyncio.sleep(10)

          asyncio.run(run())
          EOF
          python bot.py
      - name: Save Proof and Keep Active
        if: always()
        run: |
          date > last_run.txt
          git config user.name "Astrocade Bot"
          git config user.email "bot@://github.com"
          git add last_run.txt
          [ -f proof.png ] && git add proof.png
          git commit -m "Keep alive and save proof" || exit 0
          git push
