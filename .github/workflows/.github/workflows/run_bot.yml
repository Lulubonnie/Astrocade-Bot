name: Auto Play Astrocade

on:
  push:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  play-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and Play
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m pip install -q browser-use
          python -m playwright install chromium --with-deps
          python -c "import os, asyncio; os.environ['GOOGLE_API_KEY'] = os.environ.get('GEMINI_KEY') or os.environ.get('GOOGLE_KEY') or ''; from browser_use import Agent, Browser, ChatGoogle; asyncio.run(Agent(task='Go to https://astrocade.com, wait 5 seconds, click Play, and play Jam Out: Parking Puzzle by moving or clicking the parked cars in order to clear the traffic jam.', llm=ChatGoogle(model='gemini-3.8-flash-lite'), browser=Browser('chromium', headless=True)).run(max_steps=30))"
